; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = T_Embed_CC1101

[env:T_Embed_CC1101]
platform = espressif32@6.5.0
board = T_Embed_PN532
framework = arduino
lib_extra_dirs = lib_T_Embed_CC1101

upload_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps = 
    mathertel/RotaryEncoder@^1.5.3
    lewisxhe/XPowersLib
    bblanchon/ArduinoJson@^7.0.4

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -I src/Device_T_Embed_CC1101
    -I src/Device_T_Embed_CC1101/Screens
    -I src/Device_T_Embed_CC1101/Policies
    -I src/Screens

lib_ldf_mode = deep+
build_src_filter = +<*> -<Device_*/**/*> +<Device_T_Embed_CC1101/**/*>

[env:unit_tests]
platform = native
test_framework = unity
lib_deps = 
    bblanchon/ArduinoJson@^7.0.4
build_flags = 
    -std=c++11
    -I src/Device_Mock
    -I src/Device_Mock/Policies
    -I src/Screens
test_build_src = yes
build_src_filter = +<*> -<Device_*/**/*> +<Device_Mock/**/*> -<**/main.cpp>

[env:T_Display_S3_AMOLED]
platform = espressif32@6.5.0
board = esp32s3_flash_16MB
framework = arduino
lib_extra_dirs = lib_T_Display_S3_AMOLED
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200
lib_deps = 
    bblanchon/ArduinoJson@^7.0.4

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -I src/Device_T_Display_S3_AMOLED
    -I src/Device_T_Display_S3_AMOLED/Screens
    -I src/Device_T_Display_S3_AMOLED/Policies
    -I src/Screens
    -I lib_T_Display_S3_AMOLED/Mylibrary

lib_ldf_mode = deep+
build_src_filter = +<*> -<Device_*/**/*> +<Device_T_Display_S3_AMOLED/**/*>